# ===================================================================
# CatPlotLib Server & Logging Configuration
# ===================================================================

spring.application.name=CatPlotLib

# Server Port
server.port=5000

# Logging Level Configuration
logging.level.root=INFO
logging.level.in.debagnik.catplotlib=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File Upload Limits (for SVG assets)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Jackson Deserialization
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Swagger UI & OpenAPI 3 Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ===================================================================
# Plotter Hardware, Boundary & Nozzle Offset Configuration
# ===================================================================
# Plotting boundary dimensions (standard A4 printable area: 210mm x 256mm)
plotter.boundary.width=210.0
plotter.boundary.length=256.0

# Bambu Lab A1 physical bed dimensions (256mm x 256mm)
plotter.bed.width=256.0
plotter.bed.length=256.0

# Toolhead physical nozzle offset relative to pen mount (mm)
# Pen bracket mounted in front of toolhead: nozzle offset along -Y axis is -35 mm
plotter.nozzle.offset-x=0.0
plotter.nozzle.offset-y=-35.0

